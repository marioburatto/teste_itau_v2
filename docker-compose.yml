version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: compra-programada-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: compra_programada
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - compra-programada-net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    container_name: compra-programada-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - compra-programada-net

  kafka:
    image: confluentinc/cp-kafka:7.5.3
    container_name: compra-programada-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "kafka:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 30
    networks:
      - compra-programada-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: compra-programada-api
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=mysql;Port=3306;Database=compra_programada;User=root;Password=root123;"
      Kafka__BootstrapServers: "kafka:9092"
      CotacoesPath: "/app/cotacoes"
    volumes:
      - ./cotacoes:/app/cotacoes:ro
    networks:
      - compra-programada-net

volumes:
  mysql_data:

networks:
  compra-programada-net:
    driver: bridge
